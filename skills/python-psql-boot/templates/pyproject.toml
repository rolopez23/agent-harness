[project]
name = "{{APP_NAME}}-backend"
version = "0.1.0"
description = "FastAPI backend for {{APP_NAME}}"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: needs a reachable Postgres at TEST_DATABASE_URL (skipped otherwise)",
]
